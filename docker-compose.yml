services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library_sqlserver
    user: root
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=LibraryManagementDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - AdminSeed__Username=${ADMIN_USERNAME}
      - AdminSeed__Password=${ADMIN_PASSWORD}
      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__FullName=${ADMIN_FULLNAME}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
    name: library_sqlserver_data
