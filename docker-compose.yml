services:
  postgres:
    image: postgres:16-alpine
    container_name: thuvien_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-LibraryManagementDB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-LibraryManagementDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thuvien_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-LibraryManagementDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-YourPassword123!}
      - AdminSeed__Username=${ADMIN_USERNAME}
      - AdminSeed__Password=${ADMIN_PASSWORD}
      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__FullName=${ADMIN_FULLNAME}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
    name: thuvien_postgres_data
